<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="719" viewBox="0 0 2048 719">
  <defs>
    <linearGradient id="reactGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9aa0f8"/>
      <stop offset="0.55" stop-color="#8f8ff9"/>
      <stop offset="1" stop-color="#8b7ff5"/>
    </linearGradient>
    <clipPath id="canvasClip"><rect x="0" y="0" width="2048" height="719"/></clipPath>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="2048" height="719" fill="#0d1a2e"/>

  <!-- faint concentric arcs around the phone -->
  <g clip-path="url(#canvasClip)" fill="none" stroke="#1f304e" stroke-width="2">
    <circle cx="1766" cy="361" r="345"/>
    <circle cx="1766" cy="361" r="465"/>
    <circle cx="1766" cy="361" r="580"/>
  </g>

  <!-- offset device outline behind the phone -->
  <rect x="1440" y="183" width="218" height="362" rx="26" fill="#0e1c31" stroke="#2a3d5c" stroke-width="2"/>

  <!-- eyebrow -->
  <text x="112" y="162" font-family="Poppins, 'Segoe UI', sans-serif" font-size="27" font-weight="500" letter-spacing="4.5" fill="#b6b6f6" textLength="326" lengthAdjust="spacingAndGlyphs">HIGH-LEVEL AR SDK</text>

  <!-- title -->
  <text x="114" y="298" font-family="Poppins, 'Segoe UI', sans-serif" font-size="138" font-weight="600" letter-spacing="-1" textLength="928" lengthAdjust="spacingAndGlyphs"><tspan fill="#f4f6fb">arcore-</tspan><tspan fill="url(#reactGrad)">react</tspan></text>

  <!-- subtitle -->
  <text x="116" y="368" font-family="Inter, 'Segoe UI', sans-serif" font-size="42" font-weight="400" fill="#d3ddef">Put real products into your customers' rooms.</text>
  <text x="116" y="423" font-family="Inter, 'Segoe UI', sans-serif" font-size="42" font-weight="400" fill="#d3ddef">Surfaces, models and gestures — handled.</text>

  <!-- chips -->
  <g font-family="Inter, 'Segoe UI', sans-serif" font-size="26" font-weight="500" fill="#eef1f6">
    <rect x="110" y="482" width="250" height="76" rx="38" fill="#111f36" stroke="#2c3e5e" stroke-width="2"/>
    <!-- React atom -->
    <g transform="translate(163 520)" stroke="#25e2f2" stroke-width="3" fill="none">
      <ellipse rx="26" ry="10.5"/>
      <ellipse rx="26" ry="10.5" transform="rotate(60)"/>
      <ellipse rx="26" ry="10.5" transform="rotate(120)"/>
      <circle r="4.5" fill="#25e2f2" stroke="none"/>
    </g>
    <text x="209" y="529">WebXR</text>

    <rect x="376" y="482" width="332" height="76" rx="38" fill="#111f36" stroke="#2c3e5e" stroke-width="2"/>
    <!-- Android robot -->
    <g transform="translate(410 520) scale(0.85) translate(-410 -520)">
    <g fill="#9adb56">
      <path d="M388 512 a22 20 0 0 1 44 0 Z"/>
      <rect x="388" y="514" width="44" height="30" rx="6"/>
      <rect x="377" y="516" width="8" height="24" rx="4"/>
      <rect x="435" y="516" width="8" height="24" rx="4"/>
      <rect x="394" y="544" width="9" height="13" rx="4"/>
      <rect x="417" y="544" width="9" height="13" rx="4"/>
    </g>
    <g stroke="#9adb56" stroke-width="3" stroke-linecap="round">
      <line x1="399" y1="495" x2="393" y2="485"/>
      <line x1="421" y1="495" x2="427" y2="485"/>
    </g>
    <circle cx="402" cy="504" r="2.6" fill="#0d1a2e"/>
    <circle cx="418" cy="504" r="2.6" fill="#0d1a2e"/>
    </g>
    <text x="455" y="529">Android ARCore</text>

    <rect x="724" y="482" width="409" height="76" rx="38" fill="#111f36" stroke="#2c3e5e" stroke-width="2"/>
    <!-- Capacitor cube -->
    <g>
      <polygon points="768,499 786,509 768,519 750,509" fill="#c0a6ff"/>
      <polygon points="750,509 768,519 768,541 750,531" fill="#8b6cf0"/>
      <polygon points="786,509 768,519 768,541 786,531" fill="#a78bfa"/>
    </g>
    <text x="815" y="529">React + Capacitor</text>
  </g>

  <!-- terminal line -->
  <text x="116" y="633" font-family="Inter, 'Segoe UI', sans-serif" font-size="31" font-weight="600" fill="#8f7ff5">&gt;_</text>
  <text x="186" y="633" font-family="Inter, 'Segoe UI', sans-serif" font-size="31" font-weight="400" fill="#aeb9cf">npm install capacitor-arcore</text>

  <!-- phone side buttons -->
  <g fill="#dfe7f2">
    <rect x="1583" y="198" width="7" height="34" rx="3"/>
    <rect x="1583" y="244" width="7" height="26" rx="3"/>
    <rect x="1942" y="272" width="7" height="42" rx="3"/>
  </g>

  <!-- phone -->
  <rect x="1588" y="62" width="356" height="598" rx="50" fill="#0d1a2e" stroke="#dfe7f2" stroke-width="4"/>
  <rect x="1731" y="85" width="80" height="7" rx="3.5" fill="#c7d2e2"/>
  <circle cx="1831" cy="88" r="4" fill="#8fa1ba"/>

  <!-- viewfinder corners -->
  <g fill="none" stroke="#e8eef7" stroke-width="5" stroke-linecap="round">
    <path d="M1630 155 L1630 131 Q1630 120 1641 120 L1665 120"/>
    <path d="M1869 120 L1893 120 Q1904 120 1904 131 L1904 155"/>
    <path d="M1630 586 L1630 610 Q1630 621 1641 621 L1664 621"/>
    <path d="M1904 586 L1904 610 Q1904 621 1893 621 L1870 621"/>
  </g>

  <!-- AR LIVE pill -->
  <rect x="1681" y="175" width="158" height="50" rx="25" fill="#131f36" stroke="#33456a" stroke-width="2"/>
  <circle cx="1708" cy="200" r="7" fill="#8f8ff9"/>
  <text x="1726" y="208" font-family="Inter, 'Segoe UI', sans-serif" font-size="25" font-weight="600" letter-spacing="1" fill="#e6ebf5">AR LIVE</text>

  <!-- placement ellipse -->
  <ellipse cx="1766" cy="476" rx="140" ry="21" fill="none" stroke="#54678a" stroke-width="3"/>

  <!-- armchair, three-quarter view -->
  <g transform="translate(1766 390) scale(0.94) translate(-1766 -390)" stroke="#eef2f9" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round" fill="#0f1e35">
    <rect x="1710" y="306" width="128" height="88" rx="18"/>
    <rect x="1668" y="352" width="40" height="84" rx="14"/>
    <rect x="1708" y="384" width="104" height="40" rx="11"/>
    <rect x="1812" y="344" width="50" height="100" rx="14"/>
    <line x1="1690" y1="442" x2="1845" y2="442"/>
    <line x1="1700" y1="442" x2="1694" y2="472"/>
    <line x1="1760" y1="442" x2="1760" y2="466"/>
    <line x1="1832" y1="444" x2="1838" y2="474"/>
  </g>

  <!-- cube button -->
  <circle cx="1766" cy="578" r="41" fill="#101d33" stroke="#dfe7f2" stroke-width="4"/>
  <g stroke="#0d1a2e" stroke-width="2" stroke-linejoin="round">
    <polygon points="1766,562 1782,571 1766,580 1750,571" fill="#ffffff"/>
    <polygon points="1750,571 1766,580 1766,597 1750,588" fill="#c9d4e6"/>
    <polygon points="1782,571 1766,580 1766,597 1782,588" fill="#e8eef7"/>
  </g>
</svg>
